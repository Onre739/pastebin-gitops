apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pastebin-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Onre739/pastebin-gitops.git'
    targetRevision: HEAD
    path: 'k8s'           # Složka, kde leží deployment a service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true